[package]
name = "ag-horizon"
version = "0.0.0"   # the app's version comes from ../package.json (tauri.conf.json)
edition = "2021"
publish = false
description = "AG Horizon desktop app (Tauri shell; MIGRATION_PLAN.md)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-updater = "2"
semver = "1"

[target.'cfg(not(windows))'.dependencies]
keepawake = "0.5"   # 9.6 the screen stays on during playback: WebKit denies the Wake Lock API (WebView2 grants it)

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }   # the sync code, in the Keychain

[target.'cfg(target_os = "linux")'.dependencies]
# the sync code, through the Secret Service (GNOME Keyring, KWallet); zbus, so no libdbus to bundle
keyring = { version = "3.6", features = ["async-secret-service", "tokio", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }   # the sync code, in Windows Credential Manager
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
