[package]
name = "aghorizon-server-jni"
version = "0.1.0"
edition = "2021"
publish = false
description = "AG Horizon's Rust server inside the Android TV app, started over JNI (MIGRATION_PLAN.md 8.7)"

[lib]
name = "agh_server"          # libagh_server.so
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
aghorizon-server = { path = ".." }
jni = { version = "0.21", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "unwind"   # a panic in one request stays in its task; never across the JNI boundary (caught below)
