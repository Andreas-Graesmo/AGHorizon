# MIGRATION_PLAN.md 0.3: server.js as a single executable (Node SEA) that the Tauri app starts as a sidecar.
# Builds it on Windows and runs sidecar/smoke.js against the built .exe.
name: Server sidecar (Tauri migration, phase 0.3)

on:
  workflow_dispatch:
  push:
    branches: [migration/tauri]
    paths: ['desktop/**', 'sidecar/**', 'server.js', 'subtitles.js', 'unicode-ln.js', '!**/*.md', '.github/workflows/sidecar.yml']

permissions:
  contents: read

concurrency:
  group: sidecar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - name: ffmpeg-static (what the app ships today)
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/ff" ffmpeg-static@5.3.0
          echo "FFMPEG_PATH=$(node -p "require(process.argv[1])" "$RUNNER_TEMP/ff/node_modules/ffmpeg-static")" >> "$GITHUB_ENV"
      - name: Build the sidecar
        run: node sidecar/build.js
      - name: Smoke test the built .exe
        run: node sidecar/smoke.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aghorizon-server-x86_64-pc-windows-msvc
          path: sidecar/dist/aghorizon-server-*.exe
          retention-days: 7
