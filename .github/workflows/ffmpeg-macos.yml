# MIGRATION_PLAN.md 9.8: build ffmpeg for the macOS app from pinned sources (scripts/ffmpeg-macos.sh) and publish it,
# with its complete source, as a pre-release whose tag is not a version number (no update channel ever offers it).
# Published once per tag and never replaced: scripts/tauri-prep.js pins the archive by its checksum, and every build
# makes a different binary. To publish a new build, change TAG (…-2, …-3) as well as the script.
name: ffmpeg for macOS (GPL)

on:
  workflow_dispatch:
  push:
    branches: [migration/tauri]
    paths: ['scripts/ffmpeg-macos.sh', '.github/workflows/ffmpeg-macos.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      TAG: ffmpeg-n8.1.3-27-g8dca1586f4-macos-arm64-1   # = FFMPEG.mac.tag in scripts/tauri-prep.js once pinned
    steps:
      - uses: actions/checkout@v6
      - name: Build tools
        run: brew install meson ninja pkgconf || brew install meson ninja pkg-config
      - name: Build (the pins are checked against BtbN's)
        run: scripts/ffmpeg-macos.sh "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-arm64
          path: ${{ runner.temp }}/out/*.tar.xz
          retention-days: 14
      - name: Publish as a pre-release (never "latest"; only if this tag has none yet)
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::$TAG is already published; not replaced (change TAG to publish a new build)"
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "ffmpeg for the macOS app (GPL), build 1" \
            --notes "ffmpeg n8.1.3-27-g8dca1586f4 for AG Horizon on macOS (Apple silicon, macOS 12+), built by scripts/ffmpeg-macos.sh with x264, dav1d and OpenSSL at BtbN/FFmpeg-Builds' pins. The complete corresponding source is attached (the source tarballs, the build script, SHA256SUMS). Licence: GPL v3. This is not an app release." \
            "$RUNNER_TEMP"/out/*.tar.xz "$RUNNER_TEMP"/out/source/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
