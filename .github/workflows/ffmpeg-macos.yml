# MIGRATION_PLAN.md 9.8: build ffmpeg for the macOS app from pinned sources (scripts/ffmpeg-macos.sh): natively on an
# Apple silicon Mac and on an Intel one, then joined into one universal program (owner's decision 2026-11-19: one
# app for both), and publish it with its complete source as a pre-release whose tag is not a version number (no
# update channel ever offers it).
# Published once per tag and never replaced: scripts/tauri-prep.js pins the archive by its checksum, and every build
# makes a different binary. To publish a new build, change TAG (…-3, …-4) as well as the script.
name: ffmpeg for macOS (GPL)

on:
  workflow_dispatch:
  push:
    branches: [migration/tauri]
    paths: ['scripts/ffmpeg-macos.sh', '.github/workflows/ffmpeg-macos.yml']

permissions:
  contents: write

env:
  TAG: ffmpeg-n8.1.3-27-g8dca1586f4-macos-universal-3   # = the darwin build in scripts/tauri-prep.js once pinned

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26, arch: arm64 }      # (not macos-latest: GitHub's macOS 15 arm64 runners were short for hours, 2026-11-18; macos-14 is retired)
          - { os: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Build tools
        run: brew install meson ninja nasm pkgconf || brew install meson ninja nasm pkg-config
      - name: Build (the pins are checked against BtbN's)
        run: |
          [ "$(uname -m)" = "${{ matrix.arch }}" ] || { echo "::error::this runner is $(uname -m), not ${{ matrix.arch }}"; exit 1; }
          scripts/ffmpeg-macos.sh "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/out/*.tar.xz
            ${{ runner.temp }}/out/source/
          retention-days: 14

  universal:
    needs: build
    runs-on: macos-15-intel   # lipo and the checks work on either; this kind had runners free
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with: { name: ffmpeg-macos-arm64, path: arm64 }
      - uses: actions/download-artifact@v4
        with: { name: ffmpeg-macos-x86_64, path: x86_64 }
      - name: One program for both
        run: |
          # the same pins on both: the same source
          diff <(cd arm64/source && shasum -a 256 *.tar.xz) <(cd x86_64/source && shasum -a 256 *.tar.xz) || { echo "::error::the two builds' sources differ"; exit 1; }
          scripts/ffmpeg-macos.sh --combine arm64/*-macos-arm64.tar.xz x86_64/*-macos-x86_64.tar.xz out
          mkdir check && tar -C check -xJf out/*-universal.tar.xz && f="$(ls check/*/ffmpeg)"
          lipo -archs "$f" | grep -q arm64 && lipo -archs "$f" | grep -q x86_64
          "$f" -hide_banner -version | head -1
          if otool -L "$f" | tail -n +2 | grep -vE '^\s+(/usr/lib/|/System/Library/Frameworks/)'; then echo "::error::it links a library macOS doesn't have"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with: { name: ffmpeg-macos-universal, path: out/*.tar.xz, retention-days: 14 }
      - name: Publish as a pre-release (never "latest"; only if this tag has none yet)
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::$TAG is already published; not replaced (change TAG to publish a new build)"
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "ffmpeg for the macOS app (GPL), build 3: Apple silicon and Intel" \
            --notes "ffmpeg n8.1.3-27-g8dca1586f4 for AG Horizon on macOS 12+, one universal program for Apple silicon and Intel (the two builds are attached too), built by scripts/ffmpeg-macos.sh with x264, dav1d and OpenSSL at BtbN/FFmpeg-Builds' pins. The complete corresponding source is attached (the source tarballs, the build script, SHA256SUMS). Licence: GPL v3. This is not an app release." \
            out/*.tar.xz arm64/*.tar.xz x86_64/*.tar.xz arm64/source/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
