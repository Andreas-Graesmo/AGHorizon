# MIGRATION_PLAN.md Phase 5 / 9.9 gates: the installed Tauri app updates itself from N to N+1, on Windows
# (e2e/tauri-update.js), Linux (the AppImage) and macOS (the .app) (e2e/tauri-update-unix.js). Both versions are built here with a throwaway signing key, never the release key.
name: Tauri self-update (migration, phase 5)

on:
  workflow_dispatch:
  push:
    branches: [migration/tauri]
    paths: ['src-tauri/**', 'scripts/tauri-prep.js', 'scripts/tauri-release.js', 'sidecar/**', 'server-rs/**', 'server.js', 'public/js/tauri-shell.js', 'e2e/tauri-update.js', 'e2e/tauri-update-unix.js', '.github/workflows/tauri-update.yml']

permissions:
  contents: read

concurrency:
  group: tauri-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run: { shell: bash }
    env:
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: e2e-only
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - name: npm ci
        run: for i in 1 2 3; do npm ci --no-audit --no-fund && break; sleep 15; done
      - name: Player libraries into public/vendor
        run: for i in 1 2 3; do npm run setup && break; sleep 10; done
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            server-rs -> target
      - name: Sidecars (the Rust server, the pinned ffmpeg)
        run: node scripts/tauri-prep.js
      - name: Throwaway signing key, and a config that uses it (and allows the local http server)
        run: |
          npx --yes @tauri-apps/cli@2.12.4 signer generate --ci -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" -w "$RUNNER_TEMP/e2e.key"
          node -e "
            const fs = require('fs');
            fs.writeFileSync('src-tauri/tauri.e2e.json', JSON.stringify({ plugins: { updater: {
              pubkey: fs.readFileSync(process.env.RUNNER_TEMP + '/e2e.key.pub', 'utf8').trim(),
              dangerousInsecureTransportProtocol: true } } }));"
      - name: Build version N (9.0.0) and N+1 (9.0.1)
        run: |
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/e2e.key")"
          for v in 9.0.0 9.0.1; do
            node -e "const f='package.json',p=require('./'+f);p.version='$v';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
            npx --yes @tauri-apps/cli@2.12.4 build --bundles nsis --config src-tauri/tauri.e2e.json
            node scripts/tauri-release.js "e2e-out/$v" --base-url http://127.0.0.1:47900
          done
          ls -la e2e-out/*
          cat e2e-out/9.0.1/latest.json
      - name: Playwright (CDP client only; no browsers)
        run: npm install --no-save --no-audit --no-fund playwright@1.63.0
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' }
      - name: Self-update N → N+1
        run: node e2e/tauri-update.js e2e-out/9.0.0/AG-Horizon-Setup-9.0.0.exe e2e-out/9.0.1

  # Linux (the AppImage) and macOS (the .app): the same N → N+1, driven by the app itself (AGH_UPDATER_AUTO)
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, bundles: appimage }
          - { os: macos-15-intel, bundles: app }   # (GitHub's Apple silicon runners were short, 2026-11-18)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: e2e-only
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - name: Linux packages (WebKitGTK, GStreamer without its libsoup 2 plugins, Xvfb; see tauri-linux.yml)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev file xvfb \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-gl
          for p in /usr/lib/x86_64-linux-gnu/gstreamer-1.0/*.so; do ldd "$p" | grep -q 'libsoup-2.4' && sudo rm "$p"; done; true
      - name: npm ci
        run: for i in 1 2 3; do npm ci --no-audit --no-fund && break; sleep 15; done
      - name: Player libraries into public/vendor
        run: for i in 1 2 3; do npm run setup && break; sleep 10; done
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}" }
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            server-rs -> target
      - name: Sidecars (the Rust server, the pinned ffmpeg)
        run: node scripts/tauri-prep.js
      - name: Throwaway signing key, and a config that uses it (and allows the local http server)
        run: |
          npx --yes @tauri-apps/cli@2.12.4 signer generate --ci -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" -w "$RUNNER_TEMP/e2e.key"
          node -e "
            const fs = require('fs');
            fs.writeFileSync('src-tauri/tauri.e2e.json', JSON.stringify({ plugins: { updater: {
              pubkey: fs.readFileSync(process.env.RUNNER_TEMP + '/e2e.key.pub', 'utf8').trim(),
              dangerousInsecureTransportProtocol: true } } }));"
      - name: Build version N (9.0.0) and N+1 (9.0.1)
        run: |
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/e2e.key")"
          for v in 9.0.0 9.0.1; do
            node -e "const f='package.json',p=require('./'+f);p.version='$v';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
            # macOS: the universal app, as released (tauri-release.js wants its dmg too)
            [ "$RUNNER_OS" = macOS ] && rm -rf src-tauri/target/universal-apple-darwin/release/bundle/dmg
            npx --yes @tauri-apps/cli@2.12.4 build $([ "$RUNNER_OS" = macOS ] && echo --target universal-apple-darwin) --bundles ${{ matrix.bundles }}$([ "$RUNNER_OS" = macOS ] && echo ,dmg) --config src-tauri/tauri.e2e.json
            node scripts/tauri-release.js "e2e-out/$v" --base-url http://127.0.0.1:47900
            # N is run from what was built, not from the release copy (the .app itself, on macOS)
            [ "$RUNNER_OS" = macOS ] && rm -rf "e2e-out/$v/AG Horizon.app" && cp -R "src-tauri/target/universal-apple-darwin/release/bundle/macos/AG Horizon.app" "e2e-out/$v/"
          done
          ls -la e2e-out/*
          cat e2e-out/9.0.1/latest.json
      - name: Self-update N → N+1
        run: |
          if [ "$RUNNER_OS" = macOS ]; then n="e2e-out/9.0.0/AG Horizon.app"; else n=e2e-out/9.0.0/AG-Horizon-9.0.0.AppImage; fi
          node e2e/tauri-update-unix.js "$n" e2e-out/9.0.1
