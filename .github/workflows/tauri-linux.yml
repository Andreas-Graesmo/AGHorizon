# MIGRATION_PLAN.md 9.8: build the Tauri app's Linux AppImage (with BtbN's ffmpeg and the GStreamer that WebKitGTK
# plays video with) and check it end to end (e2e/tauri-linux.js). Built on the oldest Ubuntu runner, so the
# AppImage also starts on older systems (it needs the build system's glibc or newer).
name: Tauri app on Linux (migration, phase 9)

on:
  workflow_dispatch:
  push:
    branches: [migration/tauri]
    paths: ['desktop/**', 'src-tauri/**', 'scripts/tauri-prep.js', 'server-rs/**', 'public/**', 'e2e/tauri-linux.js', '!**/*.md', '.github/workflows/tauri-linux.yml']

permissions:
  contents: read

concurrency:
  group: tauri-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      # GStreamer: base and good (containers, playback), bad (the H.264 parser), libav (the H.264/AAC/AC-3 decoders);
      # whatever is installed here goes into the AppImage
      - name: Linux packages (WebKitGTK, GStreamer, a virtual display)
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev file xvfb \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-gl
      # Ubuntu 22.04's GStreamer HTTP plugins link libsoup 2; WebKitGTK 4.1 uses libsoup 3, and both in one process
      # kills the web process ("Using libsoup2 and libsoup3 in the same process is not supported"). WebKit fetches
      # media itself, so drop those plugins before they are bundled (a throwaway runner).
      - name: GStreamer without the libsoup 2 plugins
        run: |
          dir=/usr/lib/x86_64-linux-gnu/gstreamer-1.0
          for p in "$dir"/*.so; do
            if ldd "$p" | grep -q 'libsoup-2.4'; then echo "removing $(basename "$p")"; sudo rm "$p"; fi
          done
      - name: npm ci (without Electron's binary; not needed here)
        run: for i in 1 2 3; do npm ci --no-audit --no-fund && break; sleep 15; done
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - name: Player libraries into public/vendor
        run: for i in 1 2 3; do npm run setup && break; sleep 10; done
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            server-rs -> target
      - name: Sidecars (the Rust server, the pinned ffmpeg)
        run: node scripts/tauri-prep.js
      # no updater files yet (MIGRATION_PLAN.md 9.9): they need the release signing key
      - name: Build the AppImage
        run: |
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/no-updater.json"
          npx --yes @tauri-apps/cli@2.12.4 build --bundles appimage --config "$RUNNER_TEMP/no-updater.json"
          ls -la src-tauri/target/release/bundle/appimage/
          # nothing in it may load libsoup 2 (see above)
          cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE"/src-tauri/target/release/bundle/appimage/*.AppImage --appimage-extract > /dev/null
          if find squashfs-root -name 'libsoup-2.4*' | grep -q .; then echo "libsoup 2 is in the AppImage"; exit 1; fi
          rm -rf squashfs-root
      - name: End to end
        run: node e2e/tauri-linux.js src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: AG-Horizon-Tauri-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7
