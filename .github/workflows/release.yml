# MIGRATION_PLAN.md 5.6: a mixed release while Windows has moved to Tauri and macOS/Linux are still Electron.
# Before the first tag with this file: the bridge release (MIGRATION_PLAN.md 1.4) must be out for a while.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Windows: the Tauri app (MIGRATION_PLAN.md 5.6). One installer, AG-Horizon-Setup-<version>.exe, with its updater
  # signature and latest.json, which the Tauri app and the Electron app's hand-over read. Signed with the release key
  # (repository secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD, MIGRATION_PLAN.md 1.0).
  # No Windows Electron installer and no latest.yml / beta.yml: old Windows Electron apps must only ever find the
  # bridge release, which hands over to this one (MIGRATION_PLAN.md 1.3).
  windows:
    runs-on: windows-latest
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (try $i of 3), trying again in 30 seconds"; sleep 30
          done
          exit 1
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - name: Test
        run: npm test
      - name: Download the video libraries so the app also works offline
        run: |
          for i in 1 2 3; do
            npm run setup && exit 0
            echo "Download failed (try $i of 3), trying again in 30 seconds"; sleep 30
          done
          exit 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            server-rs -> target
      - name: Sidecars (the Rust server, the pinned ffmpeg)
        run: node scripts/tauri-prep.js
      - name: The signing key is there
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error title=Signing key::The repository secret TAURI_SIGNING_PRIVATE_KEY is missing (MIGRATION_PLAN.md 1.0). Without it the app can't be updated."
            exit 1
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - name: Build the installer
        run: npx --yes @tauri-apps/cli@2.12.4 build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # built into the app (src-tauri/src/main.rs), as secrets.json is in the Electron app
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - name: Release files (AG-Horizon-Setup-<version>.exe, .sig, latest.json)
        run: node scripts/tauri-release.js release-out
      - name: Add them to the draft release
        run: |
          version="${GITHUB_REF_NAME#v}"
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          # whichever build is first makes the draft (electron-builder on macOS/Linux also finds and fills it)
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft $pre --title "$version" --notes "" || true
          gh release upload "$GITHUB_REF_NAME" release-out/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  # macOS and Linux: still the Electron app until MIGRATION_PLAN.md Phase 9. --mac / --linux only, so electron-builder
  # never builds or publishes anything for Windows; it publishes latest-mac.yml, latest-linux.yml and their beta-*.yml,
  # which the Electron updaters there read.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, platform: --mac }
          - { os: ubuntu-latest, platform: --linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Electron (~100 MB) and electron-builder's tools come from GitHub's file servers on every build; keep them
      # between builds, so a build rarely depends on those downloads (a new Electron version downloads once).
      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package.json') }}
          restore-keys: ${{ runner.os }}-electron-
      # downloads can fail for a moment (e.g. "504 Gateway Time-out"): try again before giving up
      - name: Install
        shell: bash
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (try $i of 3), trying again in 30 seconds"; sleep 30
          done
          exit 1
      - name: Test
        run: npm test
      - name: Download the video libraries so the app also works offline
        shell: bash
        run: |
          for i in 1 2 3; do
            npm run setup && exit 0
            echo "Download failed (try $i of 3), trying again in 30 seconds"; sleep 30
          done
          exit 1
      - name: Add the API keys (repository secrets OPENSUBTITLES_API_KEY and TMDB_API_KEY)
        shell: bash
        run: |
          node -e "require('fs').writeFileSync('secrets.json', JSON.stringify({ opensubtitlesApiKey: process.env.OPENSUBTITLES_API_KEY || '', tmdbApiKey: process.env.TMDB_API_KEY || '' }))"
        env:
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - name: Build and upload installers
        run: npx electron-builder ${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Android TV app: one APK, added to the same draft release. It doesn't wait for the desktop builds (a Mac
  # build can sit in GitHub's queue for a long time): by the time the APK is built, the Linux or Windows build has
  # normally made the draft, and the last step waits a little for it if not.
  android-tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Node.js for Android
        uses: actions/cache@v4
        with:
          path: android/app/libnode
          key: libnode-${{ hashFiles('android/app/build.gradle.kts') }}
          restore-keys: libnode-
      - name: Add the API keys (repository secrets OPENSUBTITLES_API_KEY and TMDB_API_KEY)
        run: |
          node -e "require('fs').writeFileSync('secrets.json', JSON.stringify({ opensubtitlesApiKey: process.env.OPENSUBTITLES_API_KEY || '', tmdbApiKey: process.env.TMDB_API_KEY || '' }))"
        env:
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      # Android only installs a new version over the old one when both are signed with the same key: yours, kept as
      # repository secrets (RELEASING.md, "Android TV"). Without it the build is signed with a throwaway key.
      - name: The signing key (repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS)
        id: key
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "file=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Android TV::No signing key is set up (see RELEASING.md), so this APK is signed with a throwaway key: it installs, but the next version can't be installed over it without uninstalling first."
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Build
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Add the APK to the draft release
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="AG-Horizon-TV-$version.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          # the desktop builds make the draft; wait up to five minutes for it before making it here
          for i in $(seq 1 30); do
            gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && break
            sleep 10
          done
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "$version" --notes ""
          gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  # Test versions (a tag with a dash, e.g. v2.5.0-beta.1). Their draft is always marked as a pre-release, even when a
  # build failed, so publishing it by hand can't make it GitHub's "latest release" (which every installed app takes).
  # Once the desktop and Android TV builds are done, it is published by itself:
  # only apps on the Test update channel pick it up. Stable versions stay drafts until you press Publish.
  publish-test:
    needs: [windows, desktop, android-tv]
    if: ${{ !cancelled() && contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Mark the draft as a pre-release
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then gh release edit "$GITHUB_REF_NAME" --prerelease
          else echo "::warning::No release $GITHUB_REF_NAME was made (every build failed?)"; fi
      - name: Publish it
        if: ${{ needs.windows.result == 'success' && needs.desktop.result == 'success' && needs.android-tv.result == 'success' }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
