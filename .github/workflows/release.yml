name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Electron (~100 MB) and electron-builder's tools come from GitHub's file servers on every build; keep them
      # between builds, so a build rarely depends on those downloads (a new Electron version downloads once).
      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package.json') }}
          restore-keys: ${{ runner.os }}-electron-
      # downloads can fail for a moment (e.g. "504 Gateway Time-out"): try again before giving up
      - name: Install
        shell: bash
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (try $i of 3), trying again in 30 seconds"; sleep 30
          done
          exit 1
      - name: Test
        run: npm test
      - name: Download the video libraries so the app also works offline
        shell: bash
        run: |
          for i in 1 2 3; do
            npm run setup && exit 0
            echo "Download failed (try $i of 3), trying again in 30 seconds"; sleep 30
          done
          exit 1
      - name: Add the API keys (repository secrets OPENSUBTITLES_API_KEY and TMDB_API_KEY)
        shell: bash
        run: |
          node -e "require('fs').writeFileSync('secrets.json', JSON.stringify({ opensubtitlesApiKey: process.env.OPENSUBTITLES_API_KEY || '', tmdbApiKey: process.env.TMDB_API_KEY || '' }))"
        env:
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - name: Build and upload installers
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Android TV app: one APK, added to the same draft release once the desktop builds have made it.
  android-tv:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Node.js for Android
        uses: actions/cache@v4
        with:
          path: android/app/libnode
          key: libnode-${{ hashFiles('android/app/build.gradle.kts') }}
          restore-keys: libnode-
      - name: Add the API keys (repository secrets OPENSUBTITLES_API_KEY and TMDB_API_KEY)
        run: |
          node -e "require('fs').writeFileSync('secrets.json', JSON.stringify({ opensubtitlesApiKey: process.env.OPENSUBTITLES_API_KEY || '', tmdbApiKey: process.env.TMDB_API_KEY || '' }))"
        env:
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      # Android only installs a new version over the old one when both are signed with the same key: yours, kept as
      # repository secrets (RELEASING.md, "Android TV"). Without it the build is signed with a throwaway key.
      - name: The signing key (repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS)
        id: key
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "file=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Android TV::No signing key is set up (see RELEASING.md), so this APK is signed with a throwaway key: it installs, but the next version can't be installed over it without uninstalling first."
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Build
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Add the APK to the draft release
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="AG-Horizon-TV-$version.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "$version" --notes ""
          gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  # Test versions (a tag with a dash, e.g. v2.5.0-beta.1) go out by themselves once the desktop and Android TV builds are done:
  # published as a GitHub pre-release, which only apps on the Test update channel pick up.
  # Stable versions stay drafts until you press Publish.
  publish-test:
    needs: [build, android-tv]
    if: contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft as a pre-release
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
