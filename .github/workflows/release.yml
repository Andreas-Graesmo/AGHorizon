name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Electron (~100 MB) and electron-builder's tools come from GitHub's file servers on every build; keep them
      # between builds, so a build rarely depends on those downloads (a new Electron version downloads once).
      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package.json') }}
          restore-keys: ${{ runner.os }}-electron-
      # downloads can fail for a moment (e.g. "504 Gateway Time-out"): try again before giving up
      - name: Install
        shell: bash
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (try $i of 3), trying again in 30 seconds"; sleep 30
          done
          exit 1
      - name: Test
        run: npm test
      - name: Download the video libraries so the app also works offline
        shell: bash
        run: |
          for i in 1 2 3; do
            npm run setup && exit 0
            echo "Download failed (try $i of 3), trying again in 30 seconds"; sleep 30
          done
          exit 1
      - name: Add the API keys (repository secrets OPENSUBTITLES_API_KEY and TMDB_API_KEY)
        shell: bash
        run: |
          node -e "require('fs').writeFileSync('secrets.json', JSON.stringify({ opensubtitlesApiKey: process.env.OPENSUBTITLES_API_KEY || '', tmdbApiKey: process.env.TMDB_API_KEY || '' }))"
        env:
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - name: Build and upload installers
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Test versions (a tag with a dash, e.g. v2.5.0-beta.1) go out by themselves once all three systems are built:
  # published as a GitHub pre-release, which only apps on the Test update channel pick up.
  # Stable versions stay drafts until you press Publish.
  publish-test:
    needs: build
    if: contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft as a pre-release
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
