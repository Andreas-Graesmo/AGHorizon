# The unit tests (npm test: the page's helpers, the server, the download and sync engines, the Tauri bridge, the bridge
# release's update files), on Windows and on Linux.
name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, migration/tauri]
    paths: ['desktop/**', 'public/js/**', 'scripts/**', 'server.js', 'subtitles.js', 'test/**', 'package.json', '.gitattributes', '!**/*.md', '.github/workflows/tests.yml']

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix: { os: [windows-latest, ubuntu-latest] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - name: npm ci
        run: for i in 1 2 3; do npm ci --no-audit --no-fund && break; sleep 15; done
      - run: npm test
