# MIGRATION_PLAN.md Phase 0.1 (media) and 0.2 (popups) in the Tauri webview, with the app's real server.js.
# Windows only (WebView2, with and without the planned browser flags): the migration is Windows-first.
# The macOS (WKWebView) and Linux (WebKitGTK) jobs are in this file at commit c34f854; restore them for Phase 9.
# Results: the job log (between SPIKE-RESULTS markers), the job summary, and the "media-spike-*" artifacts.
name: Media spike (Tauri migration, phase 0.1)

on:
  workflow_dispatch:
  push:
    branches: [migration/tauri]
    paths: ['spike/media/**', '!spike/media/**/*.md', 'scripts/tauri-prep.js', '.github/workflows/media-spike.yml']

permissions:
  contents: read

concurrency:
  group: media-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    # Made once, so every webview plays the very same files.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node spike/media/gen-fixtures.js ffmpeg
      - uses: actions/upload-artifact@v4
        with: { name: spike-fixtures, path: spike/media/fixtures, retention-days: 3 }

  spike:
    needs: fixtures
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-webview2 }
          - { os: windows-latest, label: windows-webview2-noflags, noflags: '1' }
          # plan task 0.2: PiP and Mirror popups (window.open in deny / allow / create mode)
          - { os: windows-latest, label: windows-webview2-popups, url: 'http://127.0.0.1:47831/spike/popup.html?exit=1' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: spike-fixtures, path: spike/media/fixtures }

      # The ffmpeg the Tauri app ships (scripts/tauri-prep.js: BtbN 8.1, MIGRATION_PLAN.md 5.9), for /api/probe and /api/transcode
      - name: ffmpeg (as shipped)
        run: |
          node scripts/tauri-prep.js --skip-server
          echo "FFMPEG_PATH=$PWD/src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe" >> "$GITHUB_ENV"
          src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -hide_banner -version | head -1
      - name: Player libraries (hls.js, mpegts.js) into public/vendor
        run: |
          for i in 1 2 3; do npm run setup && break; sleep 10; done
          test -s public/vendor/hls.min.js && test -s public/vendor/mpegts.js

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: 'spike/media/tauri -> target' }
      - name: Build the Tauri spike app
        working-directory: spike/media/tauri
        run: cargo build --release

      - name: Run the spike
        env:
          SPIKE_TIMEOUT: '900'
          SPIKE_NO_FLAGS: ${{ matrix.noflags }}
          SPIKE_URL: ${{ matrix.url || 'http://127.0.0.1:47831/spike/?exit=1' }}
        run: |
          [ -z "$SPIKE_NO_FLAGS" ] && unset SPIKE_NO_FLAGS
          node spike/media/serve.js --label "${{ matrix.label }}" > serve.log 2>&1 &
          sleep 2
          spike/media/tauri/target/release/aghorizon-media-spike.exe > app.log 2>&1 || echo "app exit $?"
          sleep 1
          echo "::group::server log"; cat serve.log; echo "::endgroup::"
          echo "::group::app log (tail)"; tail -50 app.log; echo "::endgroup::"
          f="spike/media/results/${{ matrix.label }}.json"
          test -s "$f" || { echo "::error::no results written (the page hung or crashed; see the progress lines above)"; exit 1; }
          echo "SPIKE-RESULTS-BEGIN"; node -e "process.stdout.write(JSON.stringify(require(process.argv[1])))" "$PWD/$f"; echo; echo "SPIKE-RESULTS-END"
          node spike/media/report.js "$f" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-spike-${{ matrix.label }}
          path: |
            spike/media/results/
            serve.log
            app.log
          retention-days: 14
