# MIGRATION_PLAN.md Phase 0.1: what each Tauri webview can play, through the app's real server.js.
# Windows (WebView2, with and without the planned browser flags), macOS (WKWebView), Linux (WebKitGTK).
# Results: the job log (between SPIKE-RESULTS markers), the job summary, and the "media-spike-*" artifacts.
name: Media spike (Tauri migration, phase 0.1)

on:
  workflow_dispatch:
  push:
    branches: [fix/code-review]
    paths: ['spike/media/**', '.github/workflows/media-spike.yml']

permissions:
  contents: read

concurrency:
  group: media-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    # Made once, so every webview plays the very same files.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node spike/media/gen-fixtures.js ffmpeg
      - uses: actions/upload-artifact@v4
        with: { name: spike-fixtures, path: spike/media/fixtures, retention-days: 3 }

  spike:
    needs: fixtures
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-webview2 }
          - { os: windows-latest, label: windows-webview2-noflags, noflags: '1' }
          - { os: macos-latest, label: macos-wkwebview }
          - { os: ubuntu-22.04, label: linux-webkitgtk }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: spike-fixtures, path: spike/media/fixtures }

      - name: Linux packages (WebKitGTK, GStreamer, a virtual display and a null sound card)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf xvfb pulseaudio \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-gl

      # The ffmpeg the desktop app ships today (ffmpeg-static), for /api/probe and /api/transcode
      - name: ffmpeg-static
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/ff" ffmpeg-static@5.3.0
          echo "FFMPEG_PATH=$(node -p "require(process.argv[1])" "$RUNNER_TEMP/ff/node_modules/ffmpeg-static")" >> "$GITHUB_ENV"
      - name: Player libraries (hls.js, mpegts.js) into public/vendor
        run: |
          for i in 1 2 3; do npm run setup && break; sleep 10; done
          test -s public/vendor/hls.min.js && test -s public/vendor/mpegts.js

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: 'spike/media/tauri -> target' }
      - name: Build the Tauri spike app
        working-directory: spike/media/tauri
        run: cargo build --release

      - name: Run the spike
        env:
          SPIKE_TIMEOUT: '900'
          SPIKE_NO_FLAGS: ${{ matrix.noflags }}
        run: |
          [ -z "$SPIKE_NO_FLAGS" ] && unset SPIKE_NO_FLAGS
          node spike/media/serve.js --label "${{ matrix.label }}" > serve.log 2>&1 &
          sleep 2
          APP=spike/media/tauri/target/release/aghorizon-media-spike
          case "$RUNNER_OS" in
            Linux)
              pulseaudio --start --exit-idle-time=-1 || true
              pactl load-module module-null-sink sink_name=null >/dev/null 2>&1 && pactl set-default-sink null || true
              xvfb-run -a -s "-screen 0 1280x1024x24" "$APP" > app.log 2>&1 || echo "app exit $?" ;;
            Windows) "$APP.exe" > app.log 2>&1 || echo "app exit $?" ;;
            *) "$APP" > app.log 2>&1 || echo "app exit $?" ;;
          esac
          sleep 1
          echo "::group::server log"; cat serve.log; echo "::endgroup::"
          echo "::group::app log (tail)"; tail -50 app.log; echo "::endgroup::"
          f="spike/media/results/${{ matrix.label }}.json"
          test -s "$f" || { echo "::error::no results written (the page hung or crashed; see the progress lines above)"; exit 1; }
          echo "SPIKE-RESULTS-BEGIN"; node -e "process.stdout.write(JSON.stringify(require(process.argv[1])))" "$PWD/$f"; echo; echo "SPIKE-RESULTS-END"
          node spike/media/report.js "$f" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-spike-${{ matrix.label }}
          path: |
            spike/media/results/
            serve.log
            app.log
          retention-days: 14
